<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#F3F4F6" />
    <meta
      name="description"
      content="Pablo Coria — Software Engineer. IoT, Cloud, infraestructura y desarrollo de software a medida."
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>Pablo Coria — Software Engineer</title>

    <!-- Open Graph / preview cards para LinkedIn, WhatsApp, etc. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://pcoria.com" />
    <meta property="og:title" content="Pablo Coria — Software Engineer" />
    <meta
      property="og:description"
      content="Software Engineer trabajando en infraestructura, desarrollo de software, hardware/IoT y cloud, de punta a punta."
    />
    <meta property="og:image" content="https://pcoria.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Pablo Coria — Software Engineer" />
    <meta
      name="twitter:description"
      content="Software Engineer trabajando en infraestructura, desarrollo de software, hardware/IoT y cloud, de punta a punta."
    />
    <meta name="twitter:image" content="https://pcoria.com/og-image.png" />
    <script>
      // Tema por defecto: claro. Si el usuario eligió oscuro antes,
      // se aplica acá mismo (antes de pintar) para no parpadear.
      (function () {
        try {
          if (localStorage.getItem('portfolio_theme') === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
